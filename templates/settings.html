{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
  <h1>Settings</h1>
  <p class="meta">平均周期不固定 — 可在下面手动修改。改完后请到 Market Dashboard 重新「刷新行情」。</p>

  <form class="settings-form" method="post" action="{{ url_for('settings') }}">
    <label for="sma_period">平均周期（SMA 天数）</label>
    <div class="preset-row">
      {% for p in presets %}
        <button type="button" onclick="document.getElementById('sma_period').value='{{ p }}'">{{ p }}</button>
      {% endfor %}
    </div>
    <input id="sma_period" name="sma_period" type="number" min="5" max="250" step="1" value="{{ sma_period }}" required />

    <label for="rebound_lookback">反弹率回看天数（相对近期低点）</label>
    <input id="rebound_lookback" name="rebound_lookback" type="number" min="5" max="250" step="1" value="{{ rebound_lookback }}" required />

    <label>数据源</label>
    <select name="data_source" disabled>
      <option value="yahoo" selected>Yahoo Finance（当前）</option>
      <option value="ibkr">IBKR（以后升级）</option>
    </select>
    <input type="hidden" name="data_source" value="yahoo" />

    <div style="margin-top:18px">
      <button class="btn primary" type="submit">保存</button>
      <a class="btn" href="{{ url_for('market_dashboard') }}">返回 Dashboard</a>
    </div>
  </form>
{% endblock %}
